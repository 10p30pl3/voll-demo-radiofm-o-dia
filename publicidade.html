<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicidade — Portal Operacional FM O Dia</title>
<link rel="icon" href="assets/logo-fmodia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B8003A}a:hover{color:#8A002B}
h1,h2,h3{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:0.01em}
</style>
<style>#app button:focus-visible,#app a:focus-visible,#app input:focus-visible,#app select:focus-visible{outline:3px solid #007CC2;outline-offset:2px}</style>
<style id="fixed-sidebar">
#app nav[aria-label="Menu do portal"] {
  position: fixed;
  inset: 0 auto 0 0;
  width: 250px;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  z-index: 20;
}
#app nav[aria-label="Menu do portal"] > * { flex-shrink: 0; }
#app nav[aria-label="Menu do portal"] + div {
  margin-left: 250px;
  flex: 1 1 auto !important;
  width: calc(100% - 250px);
  max-width: calc(100% - 250px);
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FBF8EF; color: #2A2228; font-family: 'Barlow', 'Helvetica Neue', sans-serif;">

  <nav aria-label="Menu do portal" style="flex: 1 1 230px; max-width: 250px; box-sizing: border-box; padding: 24px 16px 32px; background: #D20143; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 0 4px 24px;">
      <img src="assets/logo-fmodia.png" alt="FM O Dia 100,5 — Alegria que irradia" style="width: 206px; height: auto; display: block;">
      <span style="padding: 4px 10px; border-radius: 6px; background: #FEF9C0; color: #B8003A; font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;">Portal Operacional</span>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
      <a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: {{n.fg}}; background: {{n.bg}}; font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-size: 18px; font-weight: {{n.fw}};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span>{{n.label}}</span>
      </a>
    </sc-for>
  </nav>

  <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column;">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #EFE8D8;">
      <div style="display: flex; align-items: center; gap: 12px; flex: 1 1 auto;">
        <span style="font-size: 19px; font-weight: 700;">Portal Operacional FM O Dia</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #FDE6EC; color: #B8003A; font-size: 12px; font-weight: 700;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #D20143;"></span>AO VIVO</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex: 0 1 380px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #F5F0E3;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6168" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"></path></svg>
        <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Buscar</label>
        <input id="busca" type="search" placeholder="Buscar ouvintes, mensagens, pedidos de música, promoções…" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; font: inherit; font-size: 13px; color: #2A2228;">
      </div>
      <button type="button" aria-label="Notificações, 3 novas" style="position: relative; width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #2A2228; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: #D20143; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
      </button>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #007CC2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">CM</div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 600;">Carla Mendes</span>
          <span style="font-size: 12px; color: #6B6168;">Operação | FM O Dia</span>
        </div>
      </div>
    </header>

    <main style="box-sizing: border-box; padding: 28px 32px 36px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-size: 30px; font-weight: 700;">Publicidade</h1>
          <span style="font-size: 15px; color: #6B6168;">O chatbot pergunta se o ouvinte quer receber a oferta, só apresenta o anúncio quando há aceite e registra a resposta.</span>
        </div>
        <button type="button" style="min-height: 46px; padding: 0 20px; border: none; border-radius: 12px; background: #D20143; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Nova oferta</button>
      </div>
      <section aria-label="Resumo" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05); min-width: 0;">
            <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: {{s.tileBg}}; color: {{s.tileFg}}; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 13px; font-weight: 600;">{{s.label}}</span>
              <span style="font-size: 28px; font-weight: 700;">{{s.value}}</span>
              <span style="font-size: 12px; color: #6B6168;">{{s.note}}</span>
            </div>
          </div>
        </sc-for>
      </section>

      <section style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
        <div style="flex: 3 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Regras da oferta — {{off.sponsor}}</h2>
            <span style="font-size: 13px; color: #6B6168;">Escolha uma oferta na tabela abaixo e ajuste formato, frequência e momento.</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 14px 20px;">
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px;">
              <span style="font-size: 13px; font-weight: 600;">Formato do anúncio</span>
              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <sc-for list="{{fmtChips}}" as="c" hint-placeholder-count="2">
                  <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{c.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px;">
              <span style="font-size: 13px; font-weight: 600;">Frequência</span>
              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <sc-for list="{{freqChips}}" as="c" hint-placeholder-count="3">
                  <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{c.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px;">
              <span style="font-size: 13px; font-weight: 600;">Momento da oferta</span>
              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <sc-for list="{{whenChips}}" as="c" hint-placeholder-count="3">
                  <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{c.label}}</button>
                </sc-for>
              </div>
            </div>
          </div>
          <div style="padding: 14px 16px; border-radius: 12px; background: #FFF9DB; border: 1px solid #F2D27A; font-size: 13px; color: #4A4247;">
            <span style="font-weight: 700; color: #2A2228;">Resumo:</span> {{summary}}
          </div>
        </div>

        <div style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Pré-visualização no WhatsApp</h2>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #ECE5DD;">
            <div style="align-self: flex-start; max-width: 85%; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font-size: 14px;">{{ask}}</div>
            <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; gap: 8px;">
                <button type="button" onClick="{{yes}}" style="flex: 1; min-height: 44px; border: none; border-radius: 12px; background: #FFFFFF; color: #007CC2; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Sim, quero ver</button>
                <button type="button" onClick="{{no}}" style="flex: 1; min-height: 44px; border: none; border-radius: 12px; background: #FFFFFF; color: #007CC2; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Agora não</button>
              </div>
            </sc-if>
            <sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
              <div style="align-self: flex-end; max-width: 85%; padding: 10px 12px; border-radius: 12px; background: #DCF8C6; font-size: 14px;">{{answer}}</div>
              <sc-if value="{{accepted}}" hint-placeholder-val="{{false}}">
                <div style="align-self: flex-start; max-width: 92%; padding: 6px; border-radius: 12px; background: #FFFFFF; font-size: 14px; display: flex; flex-direction: column; gap: 6px;">
                  <span style="padding: 2px 6px; font-size: 11px; font-weight: 700; color: #6B6168;">{{adFmt}}</span>
                  <sc-if value="{{hasImg}}" hint-placeholder-val="{{true}}"><img src="{{adImg}}" alt="{{adAlt}}" style="display: block; width: 100%; height: auto; border-radius: 8px;"></sc-if>
                  <span style="padding: 2px 6px 4px;">{{adText}}</span>
                </div>
              </sc-if>
              <button type="button" onClick="{{reset}}" style="align-self: flex-start; min-height: 38px; padding: 0 14px; border: 1px solid #E5DCC8; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Reiniciar simulação</button>
            </sc-if>
          </div>
          <span style="font-size: 12px; color: #6B6168;">{{reg}}</span>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 12px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Indicadores por patrocinador</h2>
          <span style="font-size: 13px; color: #6B6168;">Hoje. Clique em uma linha para editar as regras da oferta.</span>
        </div>
        <div style="overflow-x: auto;">
          <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px;">
            <thead><tr style="text-align: left; color: #6B6168; font-size: 12px;"><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Patrocinador</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Formato</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Ofertas enviadas</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Aceites</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Taxa de aceite</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Recusas</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Cliques</th></tr></thead>
            <tbody>
              <sc-for list="{{offers}}" as="o" hint-placeholder-count="4">
                <tr style="background: {{o.bg}};">
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;"><button type="button" onClick="{{o.pick}}" style="border: none; background: transparent; padding: 0; font: inherit; font-weight: 700; color: #B8003A; cursor: pointer; text-align: left;">{{o.sponsor}}</button></td>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{o.fmt}}</td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{o.sent}}</td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{o.yes}}</td>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;"><span style="font-weight: 700;">{{o.rate}}</span></td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{o.no}}</td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{o.clicks}}</td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>

      <footer style="font-size: 12px; color: #6B6168;">Tela ilustrativa — dados fictícios. Patrocinadores, formatos e limites de frequência definidos com a rádio durante o projeto.</footer>
    </main>
  </div>
</div>
</script>
<script src="assets/dc-lite.js"></script>
<script src="assets/anuncios.js"></script>
<script>
var STAR = 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z';
var MEGA = 'M3 11v3a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14';
var I = {
  home: 'M3 11l9-7 9 7M5 10v10h14V10',
  wave: 'M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4',
  users: 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-2a4 4 0 0 0-3-3.87M16 2.13a4 4 0 0 1 0 7.75',
  cal: 'M4 5h16v16H4zM4 10h16M8 3v4M16 3v4',
  gift: 'M3 8h18v4H3zM5 12v9h14v-9M12 8v13M12 8C10 4 7 4 7 6s3 2 5 2c2 0 5 0 5-2s-3-2-5 2',
  trophy: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4',
  check: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M8 12l3 3 5-6',
  chat: 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12'
};

var FMT = ['Texto', 'Imagem estática'];
var FREQ = ['1 por dia', '1 por semana', '1 por campanha'];
var WHEN = ['Após participar de promoção', 'Ao iniciar a conversa', 'Após enviar áudio'];
var OFFERS = [
  { sponsor: 'Supermercados Guanabara', fmt: 1, freq: 1, when: 0, sent: 1840, yes: 612, no: 905, clicks: 241, text: 'Ofertas da semana com até 30% de desconto. Toque para ver o encarte.' },
  { sponsor: 'Cervejaria Região Oceânica', fmt: 1, freq: 0, when: 1, sent: 960, yes: 288, no: 511, clicks: 97, text: 'Happy hour em dobro nos bares parceiros, de quinta a sábado.' },
  { sponsor: 'Clínica Sorriso Carioca', fmt: 1, freq: 2, when: 2, sent: 410, yes: 98, no: 242, clicks: 31, text: 'Avaliação odontológica gratuita para ouvintes da FM O Dia.' },
  { sponsor: 'Shopping Plaza Niterói', fmt: 1, freq: 1, when: 0, sent: 1275, yes: 466, no: 603, clicks: 184, text: 'Liquidação de inverno: lojas com até 50% off neste fim de semana.' }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0, ov: {}, ans: null, counts: {} }; }
  renderVals() {
    var self = this; var active = 'Publicidade';
    var navDefs = [['Painel operacional', I.home, 'index.html'], ['Aprovação de mensagens', I.wave, 'aprovacao.html'], ['Ouvintes', I.users, 'ouvintes.html'], ['Grade e assunto', I.cal, 'grade.html'], ['Promoções e sorteios', I.gift, 'promocoes.html'], ['FM O Dia Raiz', STAR, 'fmdiaraiz.html'], ['Publicidade', MEGA, 'publicidade.html']];
    var nav = navDefs.map(function (d) {
      var on = d[0] === active;
      return { label: d[0], icon: d[1], href: d[2], fg: on ? '#B8003A' : '#FFFFFF', bg: on ? '#FEF9C0' : 'transparent', fw: on ? 700 : 600 };
    });
    var chip = function (label, on, fn) { return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#D20143' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A2228', border: on ? '#D20143' : '#E5DCC8', pick: fn }; };
    var sel = this.state.sel, base = OFFERS[sel], ov = this.state.ov[sel] || {};
    var cfg = { fmt: ov.fmt !== undefined ? ov.fmt : base.fmt, freq: ov.freq !== undefined ? ov.freq : base.freq, when: ov.when !== undefined ? ov.when : base.when };
    var set = function (k, v) { var all = Object.assign({}, self.state.ov); all[sel] = Object.assign({}, ov); all[sel][k] = v; self.setState({ ov: all }); };
    var cnt = this.state.counts[sel] || { y: 0, n: 0 };
    var ans = this.state.ans;
    var offers = OFFERS.map(function (o, i) {
      var c = self.state.counts[i] || { y: 0, n: 0 }, oo = self.state.ov[i] || {};
      var yes = o.yes + c.y, no = o.no + c.n, sent = o.sent + c.y + c.n;
      return { sponsor: o.sponsor, fmt: FMT[oo.fmt !== undefined ? oo.fmt : o.fmt], sent: sent.toLocaleString('pt-BR'), yes: yes.toLocaleString('pt-BR'), no: no.toLocaleString('pt-BR'), clicks: o.clicks, rate: Math.round(yes / sent * 100) + '%', bg: i === sel ? '#FFF9DB' : 'transparent', pick: function () { self.setState({ sel: i, ans: null }); } };
    });
    var answer = function (v) { var all = Object.assign({}, self.state.counts); var c = Object.assign({ y: 0, n: 0 }, all[sel]); if (v) c.y++; else c.n++; all[sel] = c; self.setState({ ans: v ? 'yes' : 'no', counts: all }); };
    return {
      nav: nav, off: base, offers: offers,
      stats: [
        { label: 'Ofertas enviadas hoje', value: '4.485', note: '4 patrocinadores ativos', icon: I.chat, tileBg: '#E3F1FA', tileFg: '#007CC2' },
        { label: 'Taxa de aceite', value: '34%', note: 'ouvintes que quiseram ver', icon: I.check, tileBg: '#E3F5EA', tileFg: '#157A42' },
        { label: 'Anúncios apresentados', value: '1.464', note: 'somente após aceite', icon: MEGA, tileBg: '#FDE6EC', tileFg: '#D20143' },
        { label: 'Cliques', value: '553', note: '38% dos anúncios', icon: I.gift, tileBg: '#FFF0E0', tileFg: '#C26A00' }
      ],
      fmtChips: FMT.map(function (n, i) { return chip(n, cfg.fmt === i, function () { set('fmt', i); }); }),
      freqChips: FREQ.map(function (n, i) { return chip(n, cfg.freq === i, function () { set('freq', i); }); }),
      whenChips: WHEN.map(function (n, i) { return chip(n, cfg.when === i, function () { set('when', i); }); }),
      summary: 'anúncio em ' + FMT[cfg.fmt].toLowerCase() + ', no máximo ' + FREQ[cfg.freq].replace('1 por ', '1 vez por ').replace('1 vez por campanha', '1 vez por campanha') + ' por ouvinte, oferecido ' + WHEN[cfg.when].toLowerCase() + '. O anúncio só aparece se o ouvinte aceitar.',
      ask: 'Quer receber uma oferta de ' + base.sponsor + '? 🎁',
      asking: !ans, answered: !!ans, accepted: ans === 'yes',
      answer: ans === 'yes' ? 'Sim, quero ver' : 'Agora não',
      adFmt: FMT[cfg.fmt].toUpperCase() + ' · ANÚNCIO',
      adText: base.text,
      hasImg: cfg.fmt !== 0,
      adImg: ANUNCIOS.image(sel),
      adAlt: 'Arte fictícia do anúncio de ' + base.sponsor,
      yes: function () { answer(true); }, no: function () { answer(false); },
      reset: function () { self.setState({ ans: null }); },
      reg: ans ? 'Resposta registrada: ' + (ans === 'yes' ? 'aceite' : 'recusa') + ' · ' + base.sponsor + ' · ' + (cnt.y + cnt.n) + ' simulação(ões) nesta sessão.' : 'A resposta do ouvinte é registrada no perfil e nos indicadores do patrocinador.'
    };
  }
}
</script>
<script>DC.mount();</script>
</body>
