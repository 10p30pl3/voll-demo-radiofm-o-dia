<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM O Dia Raiz — Portal Operacional FM O Dia</title>
<link rel="icon" href="assets/logo-fmodia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B8003A}a:hover{color:#8A002B}
h1,h2,h3{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:0.01em}
</style>
<style>#app button:focus-visible,#app a:focus-visible,#app input:focus-visible,#app select:focus-visible{outline:3px solid #007CC2;outline-offset:2px}</style>
<style id="fixed-sidebar">
#app nav[aria-label="Menu do portal"] {
  position: fixed;
  inset: 0 auto 0 0;
  width: 250px;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  z-index: 20;
}
#app nav[aria-label="Menu do portal"] > * { flex-shrink: 0; }
#app nav[aria-label="Menu do portal"] + div {
  margin-left: 250px;
  flex: 1 1 auto !important;
  width: calc(100% - 250px);
  max-width: calc(100% - 250px);
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FBF8EF; color: #2A2228; font-family: 'Barlow', 'Helvetica Neue', sans-serif;">

  <nav aria-label="Menu do portal" style="flex: 1 1 230px; max-width: 250px; box-sizing: border-box; padding: 24px 16px 32px; background: #D20143; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 0 4px 24px;">
      <img src="assets/logo-fmodia.png" alt="FM O Dia 100,5 — Alegria que irradia" style="width: 206px; height: auto; display: block;">
      <span style="padding: 4px 10px; border-radius: 6px; background: #FEF9C0; color: #B8003A; font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;">Portal Operacional</span>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
      <a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: {{n.fg}}; background: {{n.bg}}; font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-size: 18px; font-weight: {{n.fw}};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span>{{n.label}}</span>
      </a>
    </sc-for>
  </nav>

  <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column;">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #EFE8D8;">
      <div style="display: flex; align-items: center; gap: 12px; flex: 1 1 auto;">
        <span style="font-size: 19px; font-weight: 700;">Portal Operacional FM O Dia</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #FDE6EC; color: #B8003A; font-size: 12px; font-weight: 700;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #D20143;"></span>AO VIVO</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex: 0 1 380px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #F5F0E3;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6168" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"></path></svg>
        <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Buscar</label>
        <input id="busca" type="search" placeholder="Buscar ouvintes, mensagens, pedidos de música, promoções…" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; font: inherit; font-size: 13px; color: #2A2228;">
      </div>
      <button type="button" aria-label="Notificações, 3 novas" style="position: relative; width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #2A2228; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: #D20143; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
      </button>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #007CC2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">CM</div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 600;">Carla Mendes</span>
          <span style="font-size: 12px; color: #6B6168;">Operação | FM O Dia</span>
        </div>
      </div>
    </header>

    <main style="box-sizing: border-box; padding: 28px 32px 36px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-size: 30px; font-weight: 700;">FM O Dia Raiz</h1>
          <span style="font-size: 15px; color: #6B6168;">Adesão opcional do ouvinte, cadastro ampliado e regras para promoções exclusivas ou com preferência.</span>
        </div>
        <a href="promocoes.html" style="min-height: 46px; padding: 0 20px; border-radius: 12px; background: #D20143; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;">Ver promoções</a>
      </div>
      <section aria-label="Resumo" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05); min-width: 0;">
            <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: {{s.tileBg}}; color: {{s.tileFg}}; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 13px; font-weight: 600;">{{s.label}}</span>
              <span style="font-size: 28px; font-weight: 700;">{{s.value}}</span>
              <span style="font-size: 12px; color: #6B6168;">{{s.note}}</span>
            </div>
          </div>
        </sc-for>
      </section>

      <section style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
        <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Benefícios do clube</h2>
          <sc-for list="{{benefits}}" as="b" hint-placeholder-count="4">
            <div style="display: flex; gap: 12px; align-items: flex-start;">
              <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #FDE6EC; color: #D20143; display: flex; align-items: center; justify-content: center;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 14px; font-weight: 700;">{{b.title}}</span>
                <span style="font-size: 13px; color: #4A4247;">{{b.text}}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Cadastro ampliado</h2>
            <span style="font-size: 13px; color: #6B6168;">Campos pedidos pelo chatbot a quem adere ao clube. O cadastro básico (nome, CPF, cidade) continua igual para todos.</span>
          </div>
          <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #FBF8EF;">
              <span style="font-size: 14px; font-weight: 600;">{{f.name}}</span>
              <button type="button" onClick="{{f.toggle}}" aria-pressed="{{f.pressed}}" style="min-height: 38px; min-width: 110px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{f.label}}</button>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 12px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Regra de cada promoção para membros</h2>
          <span style="font-size: 13px; color: #6B6168;">Defina se a promoção é aberta, exclusiva para membros ou dá preferência no sorteio (dobro de chance). Clique para alternar.</span>
        </div>
        <div style="overflow-x: auto;">
          <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px;">
            <thead><tr style="text-align: left; color: #6B6168; font-size: 12px;"><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Promoção</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Programa</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Regra para membros</th></tr></thead>
            <tbody>
              <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
                <tr>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;"><span style="font-weight: 600;">{{r.name}}</span></td>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0; color: #4A4247;">{{r.where}}</td>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;"><button type="button" onClick="{{r.next}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{r.border}}; background: {{r.bg}}; color: {{r.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">{{r.rule}}</button></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 14px; padding: 22px; background: #FFFFFF; border: 1px solid #EFE8D8; border-radius: 16px; box-shadow: 0 2px 10px rgba(60,30,20,0.05);">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Membros</h2>
            <span style="font-size: 13px; color: #6B6168;">O membro aparece identificado em Ouvintes, nas participações e no sorteio.</span>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <sc-for list="{{filters}}" as="c" hint-placeholder-count="3">
              <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{c.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px;">
            <thead><tr style="text-align: left; color: #6B6168; font-size: 12px;"><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Membro</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Cidade</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Estilo favorito</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Programa favorito</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Desde</th><th style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #EFE8D8;">Cadastro</th></tr></thead>
            <tbody>
              <sc-for list="{{members}}" as="m" hint-placeholder-count="6">
                <tr>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;"><a href="ouvinte.html" style="text-decoration: none; font-weight: 600;">{{m.name}}</a> <span style="padding: 2px 8px; border-radius: 6px; background: #FEF9C0; color: #B8003A; font-size: 11px; font-weight: 700;">RAIZ</span></td>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{m.city}}</td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{m.style}}</td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;">{{m.show}}</td><td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0; color: #4A4247;">{{m.since}}</td>
                  <td style="padding: 12px 8px; border-bottom: 1px solid #F4EEE0;"><span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{m.bg}}; color: {{m.fg}};">{{m.status}}</span></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>

      <footer style="font-size: 12px; color: #6B6168;">Tela ilustrativa — dados fictícios. Benefícios e campos finais definidos com a rádio durante o projeto.</footer>
    </main>
  </div>
</div>
</script>
<script src="assets/dc-lite.js"></script>
<script>
var STAR = 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z';
var MEGA = 'M3 11v3a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14';
var I = {
  home: 'M3 11l9-7 9 7M5 10v10h14V10',
  wave: 'M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4',
  users: 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-2a4 4 0 0 0-3-3.87M16 2.13a4 4 0 0 1 0 7.75',
  cal: 'M4 5h16v16H4zM4 10h16M8 3v4M16 3v4',
  gift: 'M3 8h18v4H3zM5 12v9h14v-9M12 8v13M12 8C10 4 7 4 7 6s3 2 5 2c2 0 5 0 5-2s-3-2-5 2',
  trophy: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4',
  check: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M8 12l3 3 5-6',
  chat: 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12'
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { req: { 'Data de nascimento': true, 'Bairro': false, 'Estilo musical favorito': false, 'Programa favorito': false, 'Tamanho de camiseta': false, 'Aceita receber ofertas de patrocinadores': false }, rules: [0, 1, 2, 0], filter: 'Todos' };
  }
  renderVals() {
    var self = this; var active = 'FM O Dia Raiz';
    var navDefs = [['Painel operacional', I.home, 'index.html'], ['Aprovação de mensagens', I.wave, 'aprovacao.html'], ['Ouvintes', I.users, 'ouvintes.html'], ['Grade e assunto', I.cal, 'grade.html'], ['Promoções e sorteios', I.gift, 'promocoes.html'], ['FM O Dia Raiz', STAR, 'fmdiaraiz.html'], ['Publicidade', MEGA, 'publicidade.html']];
    var nav = navDefs.map(function (d) {
      var on = d[0] === active;
      return { label: d[0], icon: d[1], href: d[2], fg: on ? '#B8003A' : '#FFFFFF', bg: on ? '#FEF9C0' : 'transparent', fw: on ? 700 : 600 };
    });
    var chip = function (label, on, fn) { return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#D20143' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A2228', border: on ? '#D20143' : '#E5DCC8', pick: fn }; };
    var fields = Object.keys(this.state.req).map(function (k) {
      var on = self.state.req[k];
      return { name: k, label: on ? 'Obrigatório' : 'Opcional', pressed: on ? 'true' : 'false', bg: on ? '#D20143' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A2228', border: on ? '#D20143' : '#E5DCC8', toggle: function () { var r = Object.assign({}, self.state.req); r[k] = !r[k]; self.setState({ req: r }); } };
    });
    var RULES = [['Aberta a todos', '#F5F0E3', '#4A4247', '#E5DCC8'], ['Preferência Raiz (dobro de chance)', '#FEF9C0', '#B8003A', '#F2D27A'], ['Exclusiva Raiz', '#D20143', '#FFFFFF', '#D20143']];
    var PR = [['Promoção da hora — Back To Brasil', 'Back To Brasil · 14h às 15h'], ['Par de ingressos — show de Ferrugem', 'Funk-U · 16h às 17h'], ['Camarote FM O Dia Raiz', 'Sábado · ação especial'], ['Kit FM O Dia', 'Se Liga · 06h às 09h']];
    var rules = PR.map(function (p, i) {
      var r = RULES[self.state.rules[i]];
      return { name: p[0], where: p[1], rule: r[0], bg: r[1], fg: r[2], border: r[3], next: function () { var a = self.state.rules.slice(); a[i] = (a[i] + 1) % 3; self.setState({ rules: a }); } };
    });
    var MEM = [['Bruno Almeida', 'Rio de Janeiro', 'Funk', 'Funk-U', '12/2025', 1], ['João Silva', 'Niterói', 'Pagode', 'Se Liga', '03/2026', 1], ['Juliana Freitas', 'Duque de Caxias', 'Sertanejo', 'Back To Brasil', '05/2026', 1], ['Camila Rocha', 'Nova Iguaçu', 'Funk', 'Funk-U', '07/2026', 0], ['Carlos Ribeiro', 'São Gonçalo', 'Pagode', 'Se Liga', '08/2026', 1], ['Rafael Teixeira', 'Nova Iguaçu', 'Samba', 'Back To Brasil', '09/2026', 0]];
    var f = this.state.filter;
    var members = MEM.filter(function (m) { return f === 'Todos' || (f === 'Completos' ? m[5] : !m[5]); }).map(function (m) {
      return { name: m[0], city: m[1], style: m[2], show: m[3], since: m[4], status: m[5] ? 'Completo' : 'Falta completar', bg: m[5] ? '#E3F5EA' : '#FFF0E0', fg: m[5] ? '#157A42' : '#C26A00' };
    });
    return {
      nav: nav, fields: fields, rules: rules, members: members,
      filters: ['Todos', 'Completos', 'Incompletos'].map(function (n) { return chip(n, f === n, function () { self.setState({ filter: n }); }); }),
      stats: [
        { label: 'Membros', value: '3.482', note: '+126 na última semana', icon: I.users, tileBg: '#FDE6EC', tileFg: '#D20143' },
        { label: 'Cadastro completo', value: '71%', note: 'dos membros', icon: I.check, tileBg: '#E3F5EA', tileFg: '#157A42' },
        { label: 'Promoções com regra Raiz', value: '3', note: '2 exclusivas · 1 preferência', icon: I.gift, tileBg: '#FFF0E0', tileFg: '#C26A00' },
        { label: 'Ganhadores membros', value: '38%', note: 'dos sorteios do mês', icon: I.trophy, tileBg: '#E3F1FA', tileFg: '#007CC2' }
      ],
      benefits: [
        { icon: I.gift, title: 'Promoções exclusivas', text: 'Ações e sorteios abertos somente a membros.' },
        { icon: I.trophy, title: 'Preferência nos sorteios', text: 'Em promoções com preferência, o membro tem o dobro de chance.' },
        { icon: I.cal, title: 'Desconto em ingressos', text: 'Condições especiais em shows e eventos parceiros.' },
        { icon: I.chat, title: 'Atendimento prioritário', text: 'Atalho direto no menu do WhatsApp para o clube.' }
      ]
    };
  }
}
</script>
<script>DC.mount();</script>
</body>
</html>
